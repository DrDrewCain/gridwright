[workspace]
resolver = "3"
members = [
    "crates/gridwright-model",
    "crates/gridwright-net",
    "crates/gridwright-io",
    "crates/gridwright-simplex",
    "crates/gridwright-acopf",
    "crates/gridwright-emissions",
    "crates/gridwright-build",
    "crates/gridwright-solve",
    "crates/gridwright-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "AGPL-3.0-only"
repository = "https://github.com/DrDrewCain/gridwright"
rust-version = "1.90"

[workspace.dependencies]
gridwright-model = { path = "crates/gridwright-model" }
gridwright-net = { path = "crates/gridwright-net" }
gridwright-io = { path = "crates/gridwright-io" }
gridwright-simplex = { path = "crates/gridwright-simplex" }
gridwright-acopf = { path = "crates/gridwright-acopf" }
gridwright-emissions = { path = "crates/gridwright-emissions" }
gridwright-build = { path = "crates/gridwright-build" }
gridwright-solve = { path = "crates/gridwright-solve" }
rayon = "1.10"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Pure-Rust codecs only, so the whole reader cross-compiles to WebAssembly.
# Zstandard is a C library and is the one thing here that does not; it is
# available natively behind the `parquet-zstd` feature.
parquet = { version = "59", default-features = false, features = ["arrow", "snap", "brotli", "flate2", "flate2-rust_backend"] }

arrow-array = "59"
arrow-schema = "59"
arrow-cast = "59"
bytes = "1"
calamine = "0.36"
quick-xml = "0.41"
hdf5-pure = "0.24"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"

# The benchmark claim is about construction speed, so the profile used to make
# that claim keeps symbols rather than optimising them away.
[profile.bench-rel]
inherits = "release"
debug = true
panic = "unwind"
