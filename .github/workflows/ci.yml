# Continuous integration.
#
# This repository had no CI at all until now, which mattered more than it
# sounds: the entire interface plan rests on the engine compiling for
# `wasm32-unknown-unknown`, and nothing verified that. It worked because someone
# ran it by hand. A dependency bump could have broken the browser target
# silently and it would have been discovered months later, while building a UI
# on top of it.
#
# So there are two jobs and the second is the point.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Fail on warnings in CI without making local development noisy.
  RUSTFLAGS: -D warnings

jobs:
  test:
    name: test (native)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # HiGHS is C++ and `highs-sys` builds it from source with CMake, so the
      # native job needs a C++ toolchain. The wasm job deliberately does not,
      # which is the whole reason the solver is behind a target-conditional
      # dependency.
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake build-essential

      - uses: Swatinem/rust-cache@v2

      # `cargo fmt --check` is deliberately not gated yet. The tree currently
      # has 369 formatting diffs across 66 files, all predating this workflow,
      # and reformatting them as a side effect of adding CI would rewrite a
      # third of the repository's blame for no functional gain. Add the gate in
      # its own commit, after the reformat, when nothing is in flight.
      - name: Clippy
        run: cargo clippy --workspace --all-features --all-targets

      # The default suite, which excludes the `#[ignore]`d measurements. Those
      # take minutes to hours and are run deliberately, not on every push.
      - name: Test
        run: cargo test --workspace --all-features

  wasm:
    name: build (wasm32-unknown-unknown)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Rust with wasm target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown

      - uses: Swatinem/rust-cache@v2
        with:
          key: wasm

      # Deliberately one crate at a time with `-p`, never a workspace-wide
      # build. Cargo unifies features across workspace members when you build
      # the workspace, which would pull a C++ toolchain requirement into a
      # target that has no C++ compiler. Building per package is the documented
      # way to keep target-conditional dependencies actually conditional.
      #
      # No C++ toolchain is installed in this job on purpose: if HiGHS ever
      # leaks into the wasm dependency graph, this job fails loudly here rather
      # than at link time in someone's browser build.
      - name: Build engine crates for wasm
        run: |
          for p in gridwright-model gridwright-net gridwright-build \
                   gridwright-io gridwright-simplex; do
            echo "::group::$p"
            cargo build --release --target wasm32-unknown-unknown -p "$p"
            echo "::endgroup::"
          done

      # The solver crate only reaches wasm without its default `highs` feature.
      # This is the line that would break first if the feature split regressed.
      - name: Build solver for wasm (simplex only, no HiGHS)
        run: |
          cargo build --release --target wasm32-unknown-unknown \
            -p gridwright-solve --no-default-features --features simplex

      # A guard rather than a build: assert the C++ backend really is excluded.
      # `cargo tree` fails with a non-zero status when the package is absent,
      # so an unexpected success here means HiGHS reached the wasm graph.
      - name: Assert HiGHS is absent from the wasm dependency graph
        run: |
          if cargo tree --target wasm32-unknown-unknown \
               -p gridwright-solve --no-default-features --features simplex \
               -i highs-sys 2>/dev/null; then
            echo "::error::highs-sys is in the wasm dependency graph; the target-conditional split has regressed"
            exit 1
          fi
          echo "highs-sys correctly absent from the wasm graph"
