[package]
name = "gridwright-worker"
description = "The gridwright engine behind a WebAssembly boundary, for a browser Web Worker."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# A cdylib because that is what a browser loads, and an rlib so the protocol
# types can be tested natively without a browser in the loop.
[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# `all-formats` rather than the default, and it is not a guess: the feature is
# documented upstream as "every format that cross-compiles", and it is verified
# building for wasm32-unknown-unknown in CI. That is what lets a browser tab
# read MATPOWER, PSS/E, IEEE CDF, UCTE, CSV, JSON, Parquet, Excel, CGMES and
# netCDF with nothing uploaded anywhere.
#
# Spelled out by path rather than `workspace = true`, and this is not a style
# choice: cargo refuses `default-features = false` on an inherited workspace
# dependency outright — "cannot override workspace's default-features"
# (rust-lang/cargo#11779). Inheriting here would silently drag in the default
# feature set, which for gridwright-solve means HiGHS, which cannot compile to
# this target at all.
gridwright-io = { path = "../gridwright-io", default-features = false, features = ["all-formats"] }
gridwright-net = { path = "../gridwright-net", features = ["serde"] }
gridwright-build = { path = "../gridwright-build" }

# Deliberately not `workspace = true` with default features. The default
# includes `highs`, which is C++ and cannot reach this target at all; CI asserts
# highs-sys is absent from the wasm dependency graph. Spelling the features out
# inline rather than inheriting is also the documented workaround for
# rust-lang/cargo#11779, where workspace inheritance ignores
# `default-features = false` inside a target-conditional block.
gridwright-solve = { path = "../gridwright-solve", default-features = false, features = ["simplex"] }

serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true }

# Only on the wasm target. Building this crate natively is how the protocol
# types get tested without a browser, and that path needs no bindgen.
[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2.100"
