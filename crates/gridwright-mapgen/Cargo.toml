[package]
name = "gridwright-mapgen"
description = "Builds the studio's bundled map pyramid from public-domain source data. A development tool, not part of the shipped engine."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
# Never published: this exists to regenerate committed artefacts, and a
# consumer of the engine has no use for it.
publish = false

# A library face as well as two binaries, so the shapefile, attribute-table and
# gazetteer readers below are shared rather than written twice. Both tools exist
# to turn public source data into an artefact this repository commits.
[lib]
name = "gridwright_mapgen"
path = "src/lib.rs"

[[bin]]
name = "mapgen"
path = "src/main.rs"

# Builds an example network from published transmission data. Separate from
# mapgen because it produces a network rather than a map, and needs the engine's
# own types to do it.
[[bin]]
name = "netgen"
path = "src/bin/netgen.rs"

[dependencies]
gridwright-net.workspace = true
gridwright-io.workspace = true
